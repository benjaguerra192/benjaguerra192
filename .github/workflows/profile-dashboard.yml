name: Update profile dashboard
on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/update_dashboard.py
      - .github/workflows/profile-dashboard.yml
permissions:
  contents: write
concurrency:
  group: profile-dashboard
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Test dashboard calculations
        run: python3 -m unittest discover -s scripts -p test_dashboard.py
      - name: Build public stats
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/update_dashboard.py
      - name: Save dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/dashboard.svg assets/dashboard-mobile.svg assets/stats.json
          if ! git diff --staged --quiet; then
            git commit -m "Refresh public profile statistics"
            git push
          fi
